let coachSel = { session:'', q:'' };

function coachStats(){
  const list = COACH_LIST;
  const passed = {}, missed = {};
  list.forEach(p => { passed[p.fio] = 0; missed[p.fio] = 0; });
  let total = 0;
  COACH_SESSIONS.forEach(s => s.records.forEach(r => {
    total++;
    if(!(r.fio in passed)) return;
    if(r.note && /отпуск|др\.|рудник|не расписал/i.test(r.note)) missed[r.fio]++;
    else passed[r.fio]++;
  }));
  const done = list.filter(p => passed[p.fio] > 0).length;
  return { total, done, passed, missed, list };
}

ROUTES.coaching = function(){
  const st = coachStats();
  const sessions = COACH_SESSIONS.slice().sort((a,b)=>a.date.localeCompare(b.date));

  let rows = [];
  sessions.forEach(s => s.records.forEach(r => rows.push(Object.assign({ session:s.date }, r))));
  if(coachSel.session) rows = rows.filter(r => r.session === coachSel.session);
  if(coachSel.q){ const q = coachSel.q.toLowerCase();
    rows = rows.filter(r => (r.fio+r.pos+r.dept+(r.note||'')).toLowerCase().includes(q)); }

  const deptCount = {};
  sessions.forEach(s => s.records.forEach(r => { deptCount[r.dept] = (deptCount[r.dept]||0)+1; }));

  const html = pageHead({
    title:'Журнал коучинга КПР ПК 0–4',
    sub:'Учёт работников, прошедших обучение по новой методологии контрольно-профилактической работы в тресте «Норильскшахтсервис».',
    actions:'<button class="btn" data-goto="training">'+icon('clip','ico ico-sm')+'Тренинги</button>'
  })
  + '<div class="grid g-4" style="margin-bottom:14px">'
    + '<div class="kpi k-neut"><div class="kpi-label">Занятий</div><div class="kpi-value">'+sessions.length+'</div><div class="kpi-note">по журналам коучинга</div></div>'
    + '<div class="kpi k-ok"><div class="kpi-label">Прошли коучинг</div><div class="kpi-value">'+st.done+'<small> из '+st.list.length+'</small></div><div class="kpi-note">охват: '+pct(st.done, st.list.length)+'%</div></div>'
    + '<div class="kpi k-warn"><div class="kpi-label">Не отмечены</div><div class="kpi-value">'+(st.list.length-st.done)+'</div><div class="kpi-note">нет отметки в журналах</div></div>'
    + '<div class="kpi k-neut"><div class="kpi-label">Записей в журналах</div><div class="kpi-value">'+st.total+'</div><div class="kpi-note">с учётом отсутствующих</div></div>'
  + '</div>'

  + '<div class="grid g-2-1" style="margin-bottom:14px">'
    + '<div class="card"><div class="card-head"><div class="card-title">Занятия по датам</div>'
      + '<div class="spacer"></div><button class="btn btn-sm" id="coachAll">Показать все записи</button></div>'
      + '<div class="table-wrap"><table class="tbl" style="min-width:560px"><thead><tr><th>Дата</th><th class="num">Участников</th><th>Подразделения</th><th></th></tr></thead><tbody>'
      + sessions.map(s => {
          const deps = Array.from(new Set(s.records.map(r=>r.dept))).filter(Boolean);
          const absent = s.records.filter(r=>r.note).length;
          return '<tr><td class="num nowrap">'+fmtD(s.date)+'</td>'
            + '<td class="num">'+s.records.length+'</td>'
            + '<td><div class="pill-row" style="gap:4px">'+deps.map(d=>'<span class="chip st-neut">'+esc(d)+'</span>').join('')+'</div></td>'
            + '<td class="actions">'+(absent?'<span class="chip st-warn">отметок: '+absent+'</span> ':'')
            + '<button class="btn btn-sm btn-ghost" data-coach-sess="'+s.date+'">'+icon('search','ico ico-sm')+'</button></td></tr>';
        }).join('')
      + '</tbody></table></div></div>'
    + '<div class="card"><div class="card-head"><div class="card-title">По подразделениям</div></div>'
      + '<div class="card-body">'+barChart(Object.entries(deptCount).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k, value:v})))+'</div></div>'
  + '</div>'

  + '<div class="card" style="margin-bottom:14px"><div class="card-head"><div class="card-title">Реестр прохождения коучинга</div>'
    + '<div class="spacer"></div><span class="chip st-neut">'+st.list.length+' работников в списке</span></div>'
    + '<div class="table-wrap"><table class="tbl" style="min-width:820px"><thead><tr>'
    + '<th>ФИО</th><th>Табельный номер</th><th>Должность</th><th class="num">Занятий пройдено</th><th>Статус</th></tr></thead><tbody>'
    + st.list.map(p => {
        const n = st.passed[p.fio] || 0;
        const m = st.missed[p.fio] || 0;
        return '<tr><td class="cell-main">'+esc(p.fio)+'</td>'
          + '<td class="mono">'+esc(p.tab)+'</td>'
          + '<td>'+esc(p.pos)+'</td>'
          + '<td class="num">'+n+'</td>'
          + '<td>'+(n>0 ? '<span class="chip st-ok"><span class="dot"></span>Прошёл</span>'
              : m>0 ? '<span class="chip st-warn">Отсутствовал</span>'
              : '<span class="chip st-neut">Нет отметки</span>')+'</td></tr>';
      }).join('')
    + '</tbody></table></div></div>'

  + '<div class="card"><div class="card-head"><div class="card-title">Записи журналов</div>'
    + '<div class="spacer"></div><span class="chip st-neut">'+rows.length+'</span></div>'
    + '<div class="toolbar" style="border-top:1px solid var(--line2);border-radius:0">'
      + '<div class="search">'+icon('search')+'<input class="input" id="qCoach" placeholder="Поиск: ФИО, должность, подразделение…" value="'+esc(coachSel.q)+'"></div>'
      + '<select class="input" id="fCoachSess"><option value="">Все занятия</option>'
        + sessions.map(s=>'<option value="'+s.date+'"'+(coachSel.session===s.date?' selected':'')+'>'+fmtD(s.date)+'</option>').join('')+'</select>'
      + '<div class="tb-spacer"></div><button class="btn btn-sm" id="resetCoach">'+icon('refresh','ico ico-sm')+'Сбросить</button></div>'
    + (rows.length ? '<div class="table-wrap"><table class="tbl" style="min-width:760px"><thead><tr>'
      + '<th>Дата</th><th>ФИО</th><th>Таб. №</th><th>Должность</th><th>ВСП</th><th>Примечание</th></tr></thead><tbody>'
      + rows.map(r => '<tr><td class="num nowrap">'+fmtD(r.session)+'</td>'
        + '<td class="cell-main">'+esc(r.fio)+'</td><td class="mono">'+esc(r.tab)+'</td>'
        + '<td>'+esc(r.pos)+'</td><td>'+esc(r.dept||'—')+'</td>'
        + '<td>'+(r.note?'<span class="chip st-warn">'+esc(r.note)+'</span>':'—')+'</td></tr>').join('')
      + '</tbody></table></div>'
      : '<div class="empty"><div class="empty-ico">'+icon('search')+'</div><h4>Записи не найдены</h4><p>Измените условия поиска.</p></div>')
    + '</div>';

  return { title:'Журнал коучинга', crumb:'Обучение · коучинг · v'+APP_VERSION, html, mount(){
    $('#qCoach').addEventListener('input', e => { coachSel.q = e.target.value; const p=e.target.selectionStart; render();
      const el=$('#qCoach'); if(el){ el.focus(); try{ el.setSelectionRange(p,p); }catch(_){} } });
    $('#fCoachSess').addEventListener('change', e => { coachSel.session = e.target.value; render(); });
    $('#resetCoach').addEventListener('click', () => { coachSel = { session:'', q:'' }; render(); });
    $('#coachAll').addEventListener('click', () => { coachSel = { session:'', q:'' }; render(); });
    $$('[data-coach-sess]').forEach(b => b.addEventListener('click', () => {
      coachSel.session = b.getAttribute('data-coach-sess'); render();
      setTimeout(()=>{ const el=$('#view'); if(el) el.scrollIntoView({behavior:'smooth'}); }, 50);
    }));
  }};
};

/* ============================ БИО ============================ */
let bioF = { q:'', unit:'', status:'', risk:'', level:'' };

function bioStats(){
  const recs = BIO_RAW;
  const byUnit={}, byStatus={}, byRisk={}, byLevel={}, byMonth={}, byInsp={};
  recs.forEach(r => {
    const d=r[1], u=r[3], lv=r[4], st=r[8], risk=r[9], insp=r[6];
    byUnit[u]=(byUnit[u]||0)+1;
    byStatus[st]=(byStatus[st]||0)+1;
    byRisk[risk]=(byRisk[risk]||0)+1;
    byLevel[lv||'не указан']=(byLevel[lv||'не указан']||0)+1;
    const k=(r[2]||d||'').slice(0,7); if(k) byMonth[k]=(byMonth[k]||0)+1;
    if(insp) byInsp[insp]=(byInsp[insp]||0)+1;
  });
  return {
    recs, byUnit, byStatus, byRisk, byLevel, byMonth, byInsp,
    total: recs.length,
    critical: recs.filter(r => r[9]==='Критичный').length,
    open: recs.filter(r => r[8]==='Новое' || r[8]==='В работе').length,
    resolved: recs.filter(r => r[8]==='Устранено').length,
    dated: recs.filter(r => r[2]).length
  };
}

const BIO_RISKS = ['Критичный','Средний','Легкий','Риска нет'];
const BIO_STATUSES = ['Новое','В работе','Устранено','Архив','Недействительно'];

ROUTES.bio = function(){
  const S = bioStats();
  const units = Object.keys(S.byUnit).sort((a,b)=>S.byUnit[b]-S.byUnit[a]);
  const levels = ['ПК-0','ПК-1','ПК-2','ПК-3','ПК-4','не указан'].filter(l => S.byLevel[l]);

  let rows = BIO_RAW.slice();
  if(bioF.unit) rows = rows.filter(r => r[3]===bioF.unit);
  if(bioF.status) rows = rows.filter(r => r[8]===bioF.status);
  if(bioF.risk) rows = rows.filter(r => r[9]===bioF.risk);
  if(bioF.level) rows = rows.filter(r => (r[4]||'не указан')===bioF.level);
  if(bioF.q){ const q=bioF.q.toLowerCase();
    rows = rows.filter(r => (r[0]+' '+r[3]+' '+r[5]+' '+r[6]+' '+r[7]+' '+r[10]).toLowerCase().includes(q)); }
  rows.sort((a,b)=>(b[1]||'').localeCompare(a[1]||''));
  const shown = rows.slice(0,200);

  const riskCls={'Критичный':'st-bad','Средний':'st-warn','Легкий':'st-info','Риска нет':'st-neut'};
  const stCls={'Новое':'st-info','В работе':'st-warn','Устранено':'st-ok','Архив':'st-neut','Недействительно':'st-neut'};
  const lvCls = n => 'lv'+(n||'').replace('ПК-','');

  const html = pageHead({
    title:'БИО — быстрая идентификация опасностей',
    sub:'Фактическая выгрузка из АИС «Куба»: результаты производственного контроля, внесённые участниками пилота через приложение «Суперника». Период 05.03.2026 — 07.11.2026.',
    actions:'<button class="btn" data-goto="analytico">'+icon('chart','ico ico-sm')+'План и факт</button>'
  })
  + '<div class="banner banner-info" style="margin-bottom:14px">'+icon('info','ico')
    + '<div><strong>Это основной источник данных для анализа КПР ПК 0–4.</strong> Проверки уровней ПК-0…ПК-4 вносятся специалистами и работниками в систему БИО через «Супернику», затем выгружаются из АИС «Куба» и анализируются здесь. Выгрузка актуальна на 07.11.2026; обновление — по мере поступления данных.'
    + '</div></div>'

  + '<div class="grid g-4" style="margin-bottom:14px">'
    + '<div class="kpi k-neut"><div class="kpi-label">Всего проверок</div><div class="kpi-value">'+S.total+'</div><div class="kpi-note">в выгрузке БИО</div></div>'
    + '<div class="kpi k-ok"><div class="kpi-label">Устранено</div><div class="kpi-value">'+S.resolved+'</div><div class="kpi-note">доля: '+pct(S.resolved,S.total)+'%</div></div>'
    + '<div class="kpi k-warn"><div class="kpi-label">Требуют реагирования</div><div class="kpi-value">'+S.open+'</div><div class="kpi-note">новые и в работе</div></div>'
    + '<div class="kpi k-bad"><div class="kpi-label">Критичный риск</div><div class="kpi-value">'+S.critical+'</div><div class="kpi-note">из '+S.total+' записей</div></div>'
  + '</div>'

  + '<div class="grid g-2" style="margin-bottom:14px">'
    + '<div class="card"><div class="card-head"><div class="card-title">Проверки по уровням ПК</div>'
      + '<div class="spacer"></div><span class="chip st-neut">уровень указан в описании</span></div>'
      + '<div class="card-body">' + barChart(levels.map(l => ({
          label:l, value:S.byLevel[l],
          color: l==='не указан' ? CLR().neut : (LV_COLORS[Number(l.replace('ПК-',''))]||CLR().neut)
        }))) + '</div></div>'
    + '<div class="card"><div class="card-head"><div class="card-title">Проверки по участкам</div></div>'
      + '<div class="card-body">' + barChart(units.map(u => ({
          label:u, value:S.byUnit[u],
          color: u==='Трест (без участка)' ? CLR().neut : CLR().brand
        }))) + '</div></div>'
  + '</div>'

  + '<div class="grid g-3" style="margin-bottom:14px">'
    + '<div class="card"><div class="card-head"><div class="card-title">Уровень опасности</div></div>'
      + '<div class="card-body">' + donut(BIO_RISKS.filter(r=>S.byRisk[r]).map(r => ({
          label:r, value:S.byRisk[r],
          color: r==='Критичный'?CLR().bad : r==='Средний'?CLR().warn : r==='Легкий'?CLR().info : CLR().neut
        })), String(S.total), 'записей') + '</div></div>'
    + '<div class="card"><div class="card-head"><div class="card-title">Статусы</div></div>'
      + '<div class="card-body">' + barChart(BIO_STATUSES.filter(s=>S.byStatus[s]).map(s => ({
          label:s, value:S.byStatus[s],
          color: s==='Устранено'?CLR().ok : s==='Новое'?CLR().info : s==='В работе'?CLR().warn : CLR().neut
        }))) + '</div></div>'
    + '<div class="card"><div class="card-head"><div class="card-title">Динамика по месяцам</div></div>'
      + '<div class="card-body">' + barChart(months.map(k => ({ label:k.slice(5)+'.'+k.slice(2,4), value:S.byMonth[k] }))) + '</div></div>'
  + '</div>'

  + '<div class="card" style="margin-bottom:14px"><div class="card-head"><div class="card-title">Активность проверяющих</div>'
    + '<div class="spacer"></div><span class="chip st-neut">топ-8</span></div>'
    + '<div class="card-body">' + barChart(topInsp.map(([k,v]) => ({ label:k, value:v }))) + '</div></div>'

  + '<div class="card"><div class="card-head"><div class="card-title">Реестр проверок</div>'
    + '<div class="spacer"></div><span class="chip st-neut">'+shown.length+' из '+rows.length+'</span></div>'
    + '<div class="toolbar" style="border-top:1px solid var(--line2);border-radius:0">'
      + '<div class="search">'+icon('search')+'<input class="input" id="qBio" placeholder="Поиск по описанию, фамилии, месту…" value="'+esc(bioF.q)+'"></div>'

        + levels.map(l=>'<option value="'+esc(l)+'"'+(bioF.level===l?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
      + '<select class="input" id="fBioUnit"><option value="">Все участки</option>'

      + '<select class="input" id="fBioStatus"><option value="">Все статусы</option>'
        + BIO_STATUSES.map(s=>'<option value="'+esc(s)+'"'+(bioF.status===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'

        + BIO_RISKS.map(r=>'<option value="'+esc(r)+'"'+(bioF.risk===r?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select>'
      + '<div class="tb-spacer"></div><button class="btn btn-sm" id="resetBio">'+icon('refresh','ico ico-sm')+'Сбросить</button>'
    + '</div>'
    + (shown.length ? '<div class="table-wrap"><table class="tbl" style="min-width:1080px"><thead><tr>'
      + '<th style="width:90px">Дата</th><th style="width:78px">Уровень</th><th>Описание проверки</th>'
      + '<th style="width:150px">Проверяющий</th><th style="width:130px">Проверяемый</th>'
      + '<th style="width:100px">Статус</th><th style="width:96px">Риск</th><th style="width:110px">Участок</th></tr></thead><tbody>'
      + shown.map(r => '<tr>'
        + '<td class="num nowrap">'+fmtD(r[2]||r[1])+'</td>'
        + '<td>'+(r[4]?'<span class="chip chip-lv '+lvCls(r[4])+'">'+esc(r[4])+'</span>':'<span class="cell-sub">—</span>')+'</td>'
        + '<td class="cell-main" style="font-weight:400">'+esc(r[5])+'</td>'
        + '<td>'+esc(r[6]||'—')+'</td>'
        + '<td>'+esc(r[7]||'—')+'</td>'
        + '<td><span class="chip '+(stCls[r[8]]||'st-neut')+'">'+esc(r[8]||'—')+'</span></td>'
        + '<td><span class="chip '+(riskCls[r[9]]||'st-neut')+'">'+esc(r[9]||'—')+'</span></td>'
        + '<td>'+esc(r[3])+'</td></tr>').join('')
      + '</tbody></table></div>'
      + (rows.length>200 ? '<div class="filter-count">Показаны первые 200 записей из '+rows.length+'. Уточните фильтр, чтобы увидеть остальные.</div>' : '')

  + '</div>';

  return { title:'БИО', crumb:'Данные · быстрая идентификация опасностей · v'+APP_VERSION, html, mount(){
    $('#qBio').addEventListener('input', e => { bioF.q=e.target.value; const p=e.target.selectionStart; render();
      const el=$('#qBio'); if(el){ el.focus(); try{ el.setSelectionRange(p,p); }catch(_){} } });
    ['Level','Unit','Status','Risk'].forEach(k => {
      const el=$('#fBio'+k); if(el) el.addEventListener('change', e => { bioF[k.toLowerCase()]=e.target.value; render(); });
    });
    $('#resetBio').addEventListener('click', () => { bioF={q:'',unit:'',status:'',risk:'',level:''}; render(); });

ROUTES.roadmap = function(){
  const done = ROADMAP.filter(r => r[4]==='Выполнено').length;
  const work = ROADMAP.filter(r => r[4]==='В работе').length;
  const rest = ROADMAP.length - done - work;
  const stages = {};
  ROADMAP.forEach(r => {
    const n = String(r[0]||''); const key = n.includes('.') ? n.split('.')[0] : n;
    if(!key) return;
    stages[key] = stages[key] || { total:0, done:0 };
    stages[key].total++;
    if(r[4]==='Выполнено') stages[key].done++;
  });

  const html = pageHead({
    title:'Дорожная карта КПР ПК',
    sub:'Дорожная карта отработки матрицы КПР ПК на руднике «Заполярный»: этапы, сроки, ответственные и статус исполнения.',

  })

    + '<div class="kpi k-neut"><div class="kpi-label">Без статуса</div><div class="kpi-value">'+rest+'</div><div class="kpi-note">заполняется по факту</div></div>'

/* ------------------------------- ОБРАБОТЧИКИ ------------------------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-new-insp],[data-new-vio],[data-new-mes],[data-new-dep],[data-new-card],'
    + '[data-edit-insp],[data-edit-vio],[data-edit-mes],[data-edit-dep],[data-edit-card],'
    + '[data-del-insp],[data-del-vio],[data-del-mes],[data-del-dep],[data-del-card],'
    + '[data-fix-vio],[data-done-mes],[data-act],[data-close],[data-theme-toggle]');
  if(!t) return;
  const d = t.dataset;

  if('close' in d){ closeModal(); return; }
  if('themeToggle' in d){ toggleTheme(); return; }
  if(d.goto){
    const p = d.goto.split(':');
    if(p[0] === 'pk0cards'){ nav('pk0cards'); return; }
    nav(p[0], p[1]); return;
  }

  const preset = {};
  if(d.dept) preset.deptId = d.dept;

  if('newInsp' in d){ if(d.newInsp !== '') preset.level = Number(d.newInsp); return needDept() && inspectionForm(null, preset); }
  if('newVio' in d){ if(d.newVio !== '') preset.level = Number(d.newVio); return needDept() && violationForm(null, preset); }
  if('newMes' in d){ if(d.newMes !== '') preset.level = Number(d.newMes); return measureForm(null, preset); }
  if('newDep' in d) return departmentForm(null);
  if('newCard' in d) return cardForm(null);

  if(d.editInsp){ const x = STATE.inspections.find(i => i.id === d.editInsp); if(x) inspectionForm(x); return; }
  if(d.editVio){ const x = STATE.violations.find(i => i.id === d.editVio); if(x) violationForm(x); return; }
  if(d.editMes){ const x = STATE.measures.find(i => i.id === d.editMes); if(x) measureForm(x); return; }
  if(d.editDep){ const x = depById(d.editDep); if(x) departmentForm(x); return; }
  if(d.editCard){ const x = STATE.pk0cards.find(i => i.id === d.editCard); if(x) cardForm(x); return; }

  if(d.delInsp) return deleteInspection(d.delInsp);
  if(d.delVio) return deleteViolation(d.delVio);
  if(d.delMes) return deleteMeasure(d.delMes);
  if(d.delDep) return deleteDepartment(d.delDep);
  if(d.delCard){
    const c = STATE.pk0cards.find(x => x.id === d.delCard); if(!c) return;
    return confirmDialog({ title:'Удаление карты', danger:true, okText:'Удалить',
      text:'Карта самоконтроля «'+esc(c.profession)+'» будет удалена.',
      onOk(){ STATE.pk0cards = STATE.pk0cards.filter(x => x.id !== c.id); saveState(); render(); toast('Карта удалена.','ok'); } });
  }
  if(d.fixVio) return markFixed(d.fixVio);
  if(d.doneMes) return markMeasureDone(d.doneMes);
  if(d.act === 'clearDemo') return clearDemoData();
});

function needDept(){
  if(STATE.departments.length) return true;
  openModal({ title:'Нет подразделений',
    body:'<p class="note" style="font-size:13.4px">Перед добавлением записи необходимо добавить хотя бы одно подразделение.</p>',
    footer:'<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="goDep">Добавить подразделение</button>' });
  $('#goDep').onclick = () => { closeModal(); departmentForm(null); };
  return false;
}

/* Закрытие модального окна */
$('#overlay').addEventListener('mousedown', e => { if(e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(!$('#overlay').hidden) closeModal();
    else { document.body.classList.remove('nav-open'); $('#burger').setAttribute('aria-expanded','false'); }
  }
  if(e.key === 'Enter' && !$('#overlay').hidden && e.target.tagName === 'INPUT'){
    const btn = $('#formSave'); if(btn){ e.preventDefault(); btn.click(); }
  }
});

/* Мобильное меню */
$('#burger').addEventListener('click', () => {
  const open = !document.body.classList.contains('nav-open');
  document.body.classList.toggle('nav-open', open);
  $('#burger').setAttribute('aria-expanded', String(open));
});
$('#backdrop').addEventListener('click', () => {
  document.body.classList.remove('nav-open');
  $('#burger').setAttribute('aria-expanded','false');
});

/* Тема */
$('#themeSwitch').addEventListener('click', toggleTheme);

/* Сворачивание боковой панели */
(function initCollapse(){
  const KEY='kpr_pk_04_side_collapsed';
  const btn=$('#sideCollapse');
  const apply=(v)=>{
    document.body.classList.toggle('side-collapsed', v);
    if(btn){
      btn.setAttribute('aria-expanded', String(!v));
      btn.setAttribute('aria-label', v?'Развернуть панель':'Свернуть панель');
      btn.setAttribute('title', v?'Развернуть панель':'Свернуть панель');
      btn.innerHTML = v
        ? '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
    }
  };
  let saved=false;
  try{ saved = localStorage.getItem(KEY)==='1'; }catch(e){}
  apply(saved);
  if(btn) btn.addEventListener('click', ()=>{
    const v = !document.body.classList.contains('side-collapsed');
    apply(v);
    try{ localStorage.setItem(KEY, v?'1':'0'); }catch(e){}
    setTimeout(()=>{ try{ render(); }catch(e){} }, 190);
  });
})();

/* Импорт */
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  handleImportFile(f);
  e.target.value = '';
});

/* Синхронизация между вкладками */
window.addEventListener('storage', e => {
  if(e.key === STORAGE_KEY && e.newValue){
    try{ STATE = normalize(JSON.parse(e.newValue)); render(); }catch(_){}
  }
  if(e.key === THEME_KEY && e.newValue && e.newValue !== currentTheme()){
    applyTheme(e.newValue, { rerender:true });
  }
});
window.addEventListener('hashchange', () => { currentRoute = routeFromHash(); render(); });

/* Системная тема: следуем за ней, только если пользователь ещё не выбирал вручную */
(function watchSystemTheme(){
  if(!window.matchMedia) return;
  try{
    if(localStorage.getItem(THEME_KEY)) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const handler = ev => applyTheme(ev.matches ? 'dark' : 'light', { rerender:true });
    if(mq.addEventListener) mq.addEventListener('change', handler);
    else if(mq.addListener) mq.addListener(handler);
  }catch(e){}
})();

/* ------------------------------- ЗАПУСК ------------------------------- */
/* Версия проставляется из константы APP_VERSION — единственного места правки */
function stampVersion(){
  const chip = $('#verChip'); if(chip) chip.textContent = APP_VERSION;
  const meta = document.querySelector('meta[name="version"]');
  if(meta) meta.setAttribute('content', APP_VERSION);
  const desc = document.querySelector('meta[name="description"]');
  if(desc) desc.setAttribute('content',
    'Дашборд контрольно-профилактической работы и производственного контроля ПК-0…ПК-4. Версия '+APP_VERSION+'. Поддержка: @'+SUPPORT_TG);
  document.title = 'КПР ПК 0–4 — ТНШС · ' + APP_VERSION;
}

(function init(){
  stampVersion();
  applyTheme(currentTheme());
  loadState();
  currentRoute = routeFromHash();
  render();
  if(!storageOk){
    toast('Браузер не разрешает сохранять данные для этого файла. Изменения будут потеряны при закрытии.', 'bad');
  }
  window.__KPR_READY__ = true;
  window.__KPR_VERSION__ = APP_VERSION;
})();
</script>
